; ============================================================
;  FS4412 智能家居 LED + DS18B20 控制系统 —— 硬件配置文件
;  放在程序同目录 config.ini, 程序启动时自动加载
;  修改后重启程序生效
;
;  【FS4412 板载 LED(高电平点亮, 通过 MMBT3904 三极管驱动)】
;    LED2 = GPX2_7   LED3 = GPX1_0   LED4 = GPF3_4   LED5 = GPF3_5
;  【DS18B20 温度传感器】
;    DQ 接 GPX0_6(底板板载 4.7K 上拉, VCC 3.3V, GND 接地)
; ============================================================

[system]
; 运行模式:  0 = FS4412 真实开发板(读写 /sys 内核节点)
;            1 = 模拟模式(没有开发板时在 PC 上演示界面) 默认 1
simulation=1

; ============================================================
;  [led] 灯的引脚配置(客厅照明灯, 这里默认接板载 LED2)
; ============================================================
[led]
; ---------- 灯的 GPIO 引脚编号(开关灯用) ----------
; 内核 sysfs 编号用下面命令查询:  cat /sys/kernel/debug/gpio
; FS4412 示例: LED2 = GPX2_7, 通常对应 247 (请以你板子实际为准!)
gpio=247

; 高电平点亮填 1, 低电平点亮填 0 (FS4412 三极管驱动, 高电平点亮 -> 填 1)
activeHigh=1

; ---------- 灯的 PWM 引脚(调光用) ----------
; 若灯接在 PWM 输出引脚可调亮度, 填 PWM 通道号(0~3, 对应 GPD0_0~GPD0_3)
; 板载 LED 是纯 GPIO 灯 -> 填 -1(亮度只在界面演示, 适合答辩)
pwmChannel=-1

; ============================================================
;  [buzzer] 蜂鸣器的引脚配置(报警时播放音乐)
; ============================================================
[buzzer]
; ---------- 蜂鸣器 PWM 引脚 ----------
; FS4412 板载蜂鸣器通常接 PWM0(即 GPD0_0), 通道填 0
pwmChannel=0

; 发声频率(Hz)与占空比(%), 可调音色与音量
freq=660
dutyPercent=50

; ============================================================
;  [pwm] PWM 控制器(蜂鸣器共用)
; ============================================================
[pwm]
; PWM 控制器编号: /sys/class/pwm/pwmchip<X> 中的 X
chip=0

; ============================================================
;  [temperature] DS18B20 温度传感器
;  板载插座, 需外接传感器;  DQ = GPX0_6, 寄存器 GPX0CON=0x11000C00
; ============================================================
[temperature]
; 温度来源:
;   sim      = 模拟(PC 演示, 温度缓慢波动用于演示报警)
;   node     = 读内核节点(内核已写好 DS18B20 驱动时最稳,
;              支持 w1 标准节点 /sys/bus/w1/devices/28-xxxx/w1_slave
;              也支持自定义文件, 内容形如 "t=12345" 或 "23.5")
;   bitbang  = 用户空间用 GPIO 模拟 1-Wire 时序直接读 DS18B20
source=sim

; node 方式时的节点路径(bitbang/sim 方式忽略)
node=/sys/bus/w1/devices/28-0000041e2a01/w1_slave

; bitbang 方式时的 DQ 引脚: GPX0_6
; FS4412 内核编号通常为 230(仍以 cat /sys/kernel/debug/gpio 为准)
gpio=230

; 报警阈值(℃): 温度 >= threshold 触发报警
threshold=30.0
; 回差(℃): 温度 <= threshold - hysteresis 才解除报警(防止抖振)
hysteresis=2.0

; ============================================================
;  [alarm] 高温报警输出(LED 闪烁)
;  报警时除了蜂鸣器播放警报, 还会让这些 LED 交替闪烁
;  填写板上其它 LED 的 sysfs 编号(逗号分隔), 可留空
;  FS4412: LED3=GPX1_0(通常232), LED4/5=GPF3_4/5(以实际编号为准)
; ============================================================
[alarm]
leds=

; ============================================================
;  [adc] ADC(光敏电阻 / 电位器 / 光照采集) —— 备用功能
; ============================================================
[adc]
; ADC 原始值节点(没有可留空, 程序自动隐藏对应功能)
path=

; ADC 满量程(用于换算百分比, 12 位一般是 4095)
max=4095
